services:
  - type: web
    name: matrixai
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run test:deploy && npm run build && npm prune --omit=dev
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /api/status
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MATRIX_CLOUD_SAVE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: LLM_API_KEY
        value: ""
